<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naruto — Ninja Powers (Dual Rasengan & Chidori)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: black;
      font-family: 'Outfit', sans-serif;
    }
    #v_src, #out {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover; transform: scaleX(-1);
    }
    #out { z-index: 2; pointer-events: none; }
    .darkness {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, rgba(0, 15, 30, 0.15) 30%, rgba(3, 5, 12, 0.75) 100%);
      mix-blend-mode: multiply; pointer-events: none; z-index: 5;
    }
    .fx {
      position: absolute; height: auto; top: 0; left: 0;
      transform: translate(-50%, -50%);
      pointer-events: none; display: none;
      mix-blend-mode: screen; z-index: 20;
      will-change: left, top, width, opacity;
    }
    #n, #n2 { width: 500px; }
    #s { width: 700px; }

    /* Top control pill */
    .ninja-controls {
      position: absolute;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(13, 13, 18, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid #1a1a24;
      border-radius: 999px;
      padding: 0.45rem 1rem;
      color: #e4e4ec;
      font-size: 0.85rem;
    }

    .ninja-select {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #3b82f6;
      color: #93c5fd;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .home-link {
      color: #f97316;
      text-decoration: none;
      font-weight: 600;
      padding-right: 0.5rem;
      border-right: 1px solid #1a1a24;
    }

    /* Bottom helper */
    .ninja-guide {
      position: absolute;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      background: rgba(13, 13, 18, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid #1a1a24;
      border-radius: 999px;
      padding: 0.5rem 1.25rem;
      color: #94a3b8;
      font-size: 0.825rem;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="ninja-controls">
    <a href="index.html" class="home-link">🍥 Naruto AR Home</a>
    <span>Mode:</span>
    <select id="modeSelect" class="ninja-select">
      <option value="twin-rasengan">🌀 Twin Rasengan (Both Hands)</option>
      <option value="rasengan-chidori">⚡ Rasengan (L) + Chidori (R)</option>
    </select>
  </div>

  <div id="guideText" class="ninja-guide">
    Open <b>Left Hand</b> or <b>Right Hand</b> to channel Rasengan. Open <b>Both Hands</b> for Twin Rasengan!
  </div>

  <video id="v_src" autoplay playsinline></video>
  <canvas id="out"></canvas>
  <div class="darkness"></div>

  <!-- Rasengan Left Hand -->
  <video id="n" class="fx" src="assets/naruto.mp4" muted autoplay loop playsinline></video>
  <!-- Rasengan Right Hand (for Dual Rasengan) -->
  <video id="n2" class="fx" src="assets/naruto.mp4" muted autoplay loop playsinline></video>
  <!-- Chidori -->
  <video id="s" class="fx" src="assets/sasuke.mp4" muted autoplay loop playsinline></video>

  <script>
    const vElement = document.getElementById('v_src');
    const cElement = document.getElementById('out');
    const ctx = cElement.getContext('2d');
    const n = document.getElementById('n');
    const n2 = document.getElementById('n2');
    const s = document.getElementById('s');
    const modeSelect = document.getElementById('modeSelect');
    const guideText = document.getElementById('guideText');

    let currentMode = 'twin-rasengan';
    modeSelect.addEventListener('change', (e) => {
      currentMode = e.target.value;
      if (currentMode === 'twin-rasengan') {
        guideText.innerHTML = 'Open <b>Left Hand</b> or <b>Right Hand</b> to channel Rasengan. Open <b>Both Hands</b> for Twin Rasengan!';
      } else {
        guideText.innerHTML = 'Open <b>Left Hand</b> for Rasengan. Open <b>Right Hand</b> for Chidori!';
      }
    });

    let pwr = [0, 0]; 
    let wasOpen = [false, false];

    function checkOpen(pts) {
      let count = 0;
      const wrist = pts[0];
      const tips = [8, 12, 16, 20];
      const pips = [6, 10, 14, 18];
      for (let i = 0; i < tips.length; i++) {
        const tip = pts[tips[i]];
        const pip = pts[pips[i]];
        if (Math.hypot(tip.x - wrist.x, tip.y - wrist.y) > Math.hypot(pip.x - wrist.x, pip.y - wrist.y)) count++;
      }
      return count >= 3;
    }

    function onResults(res) {
      cElement.width = vElement.videoWidth;
      cElement.height = vElement.videoHeight;
      ctx.save();
      ctx.clearRect(0, 0, cElement.width, cElement.height);

      let handDetected = [false, false];

      n.style.display = 'none';
      n2.style.display = 'none';
      s.style.display = 'none';

      if (res.multiHandLandmarks && res.multiHandedness) {
        res.multiHandLandmarks.forEach((pts, i) => {
          const label = res.multiHandedness[i].label;
          const isR = label === 'Right';
          const idx = isR ? 1 : 0;
          handDetected[idx] = true;

          // --- BRIGHT BLUE CHAKRA SKELETON ---
          ctx.save();
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#00fbff';
          drawConnectors(ctx, pts, HAND_CONNECTIONS, {color: '#00d4ff', lineWidth: 3});
          drawLandmarks(ctx, pts, {color: '#ffffff', lineWidth: 1, radius: 2});
          ctx.restore();

          const open = checkOpen(pts);
          pwr[idx] += open ? 0.05 : -0.12;
          pwr[idx] = Math.max(0, Math.min(1, pwr[idx]));

          const wrist = pts[0];
          const knk = pts[9];
          const handSpan = Math.hypot(pts[12].x - wrist.x, pts[12].y - wrist.y) * window.innerWidth;
          const tx = (wrist.x + knk.x) / 2;
          const ty = (wrist.y + knk.y) / 2;
          const posX = `${(1 - tx) * window.innerWidth}px`;
          const posY = `${ty * window.innerHeight}px`;

          if (open && !wasOpen[idx]) {
            if (currentMode === 'twin-rasengan') {
              const targetVid = (idx === 0) ? n : n2;
              targetVid.currentTime = 0;
              targetVid.play().catch(() => {});
            } else {
              const targetVid = (idx === 0) ? n : s;
              targetVid.currentTime = 0;
              targetVid.play().catch(() => {});
            }
          }
          wasOpen[idx] = open;

          if (pwr[idx] > 0.01) {
            if (currentMode === 'twin-rasengan') {
              // Rasengan on BOTH hands!
              const targetVid = (idx === 0) ? n : n2;
              targetVid.style.width = `${Math.max(300, Math.min(850, handSpan * 3.6))}px`;
              targetVid.style.left = posX;
              targetVid.style.top = posY;
              targetVid.style.display = 'block';
              targetVid.style.opacity = pwr[idx];
            } else {
              if (idx === 0) {
                // Left hand Rasengan
                n.style.width = `${Math.max(300, Math.min(850, handSpan * 3.6))}px`;
                n.style.left = posX;
                n.style.top = posY;
                n.style.display = 'block';
                n.style.opacity = pwr[0];
              } else {
                // Right hand Chidori
                s.style.width = `${Math.max(380, Math.min(1000, handSpan * 4.4))}px`;
                s.style.left = posX;
                s.style.top = posY;
                s.style.display = 'block';
                s.style.opacity = pwr[1];
              }
            }
          }
        });
      }

      // Smooth decay when hand is lost
      if (!handDetected[0]) {
        pwr[0] = Math.max(0, pwr[0] - 0.12);
        wasOpen[0] = false;
      }
      if (!handDetected[1]) {
        pwr[1] = Math.max(0, pwr[1] - 0.12);
        wasOpen[1] = false;
      }

      ctx.restore();
    }

    const h = new Hands({
      locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`
    });

    h.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    h.onResults(onResults);

    const cam = new Camera(vElement, {
      onFrame: async () => { await h.send({ image: vElement }); },
      width: 1280, height: 720
    });
    cam.start();
  </script>
</body>
</html>
