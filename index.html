<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naruto AR — Unified Ninja Jutsu & Battle</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Pinned Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1675471629/holistic.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/selfie_segmentation.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #060608;
      --surface: #0d0d12;
      --surface-glass: rgba(13, 13, 18, 0.88);
      --border: #1a1a24;
      --border-glow: rgba(255, 255, 255, 0.12);
      --text: #e4e4ec;
      --muted: #8b8b9e;
      --accent-o: #f97316; /* Shadow clone orange */
      --accent-b: #3b82f6; /* Rasengan & Chidori blue */
      --accent-p: #a855f7; /* Combined purple */
      --accent-r: #ef4444; /* Battle red */
      --accent-g: #10b981; /* Trainer green */
      --accent-gold: #f59e0b; /* Score gold */
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }

    /* Video source & Master Canvas */
    #video { display: none; }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* Dynamic visual vignette for cinematic chakra energy */
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      background: radial-gradient(circle at center, transparent 40%, rgba(6, 6, 8, 0.6) 100%);
      transition: opacity 0.5s ease;
    }

    .vignette.darkness-boost {
      background: radial-gradient(circle at center, rgba(0, 20, 40, 0.2) 30%, rgba(3, 5, 12, 0.8) 100%);
      mix-blend-mode: multiply;
    }

    /* FX Video Overlays */
    .fx {
      position: absolute;
      height: auto;
      top: 0;
      left: 0;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
      mix-blend-mode: screen;
      z-index: 20;
      will-change: transform, opacity, left, top, width;
    }

    /* Top HUD Navigation Bar */
    .hud-header {
      position: absolute;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      background: var(--surface-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.45rem 0.85rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      max-width: 96vw;
      transition: all 0.3s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding-left: 0.5rem;
      padding-right: 0.75rem;
      border-right: 1px solid var(--border);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      color: #fff;
      cursor: default;
    }

    .brand-icon {
      font-size: 1.25rem;
      filter: drop-shadow(0 0 8px rgba(249, 115, 22, 0.4));
      animation: float-icon 3s ease-in-out infinite;
    }

    @keyframes float-icon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    /* Mode selector tabs */
    .mode-tabs {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .tab-btn {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      padding: 0.42rem 0.8rem;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.25s ease;
    }

    .tab-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active[data-mode="combined"] {
      background: rgba(168, 85, 247, 0.15);
      border-color: var(--accent-p);
      color: var(--accent-p);
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.25);
    }

    .tab-btn.active[data-mode="ninja"] {
      background: rgba(59, 130, 246, 0.15);
      border-color: var(--accent-b);
      color: var(--accent-b);
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.25);
    }

    .tab-btn.active[data-mode="shadow"] {
      background: rgba(249, 115, 22, 0.15);
      border-color: var(--accent-o);
      color: var(--accent-o);
      box-shadow: 0 0 16px rgba(249, 115, 22, 0.25);
    }

    .tab-btn.active[data-mode="battle"] {
      background: rgba(239, 68, 68, 0.18);
      border-color: var(--accent-r);
      color: #fca5a5;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.3);
    }

    .tab-btn.active[data-mode="trainer"] {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--accent-g);
      color: var(--accent-g);
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.25);
    }

    /* Controls & Jutsu Presets */
    .hud-controls {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding-left: 0.5rem;
      border-left: 1px solid var(--border);
    }

    .jutsu-select {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      color: #93c5fd;
      padding: 0.38rem 0.65rem;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.775rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }

    .jutsu-select:hover {
      border-color: var(--border-glow);
    }

    .hud-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.42rem 0.75rem;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.775rem;
      font-weight: 500;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--border-glow);
    }

    .hud-btn.active {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--accent-b);
      color: #93c5fd;
    }

    /* Seal Confidence & Alignment Indicator */
    .conf-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      padding: 0.35rem 0.7rem;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .conf-badge span {
      color: var(--accent-o);
      font-weight: 700;
    }

    .conf-badge.ready {
      border-color: var(--accent-o);
      box-shadow: 0 0 12px rgba(249, 115, 22, 0.4);
    }

    .conf-badge.ready span {
      color: #fbbf24;
    }

    /* Battle Scoreboard HUD (Visible in Battle Mode) */
    .battle-hud {
      position: absolute;
      top: 5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 28;
      display: none;
      align-items: center;
      gap: 1.5rem;
      background: rgba(13, 13, 18, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 16px;
      padding: 0.6rem 1.5rem;
      box-shadow: 0 8px 30px rgba(239, 68, 68, 0.25);
    }

    .battle-hud.visible {
      display: flex;
    }

    .score-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .score-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      font-weight: 700;
    }

    .score-val {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    .score-val.highlight {
      color: var(--accent-gold);
      text-shadow: 0 0 12px rgba(245, 158, 11, 0.6);
    }

    /* Bottom Instructions Floating Pill */
    .hud-footer {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      background: var(--surface-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.65rem 1.4rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      font-size: 0.85rem;
      color: var(--muted);
      max-width: 92vw;
      text-align: center;
      pointer-events: auto;
    }

    .jutsu-guide {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .guide-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .guide-key {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.725rem;
      font-weight: 600;
    }

    .guide-text {
      color: var(--text);
      font-weight: 500;
    }

    /* Hand Sign Overlay Button (Interactive Clone Toggle) */
    .video-overlay-btn {
      position: absolute;
      bottom: 5.5rem;
      left: 50%;
      transform: translateX(-50%);
      transform-origin: center;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 25;
      display: none;
    }

    .video-overlay-btn.visible {
      display: inline-flex;
    }

    .video-overlay-btn.pop {
      transform: translateX(-50%) scale(1.3);
    }

    .video-overlay-btn img {
      width: 105px;
      height: auto;
      filter: drop-shadow(0 0 18px rgba(249, 115, 22, 0.5));
    }

    /* Trainer Drawer / Slide-Over Modal */
    .trainer-drawer {
      position: absolute;
      top: 5rem;
      right: 1.5rem;
      width: 380px;
      max-height: calc(100vh - 7rem);
      background: var(--surface-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.5rem;
      z-index: 40;
      display: none;
      flex-direction: column;
      gap: 1.1rem;
      overflow-y: auto;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
      animation: slide-in 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .trainer-drawer.open {
      display: flex;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .drawer-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }

    .drawer-close {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.25rem;
      cursor: pointer;
      line-height: 1;
    }

    .drawer-close:hover { color: #fff; }

    .trainer-section {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .sec-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.65rem 0.75rem;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--border-glow);
    }

    .action-btn.primary {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      grid-column: span 2;
      padding: 0.8rem;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }

    .action-btn.primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .action-btn.danger {
      color: #f87171;
    }
    .action-btn.danger:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
    }

    .stats-card {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem;
      font-size: 0.825rem;
      display: flex;
      justify-content: space-around;
      color: var(--muted);
    }

    .stats-card strong {
      color: #fff;
      font-size: 0.95rem;
    }

    .trainer-status-text {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.45;
      min-height: 2.2rem;
    }

    /* Loading / Permission Overlay */
    .loader-overlay {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.4s ease;
    }

    .loader-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(249, 115, 22, 0.2);
      border-top-color: var(--accent-o);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 820px) {
      .hud-header {
        top: 0.5rem;
        flex-direction: column;
        border-radius: 20px;
        padding: 0.6rem;
        gap: 0.45rem;
      }
      .brand { border-right: none; padding: 0; }
      .hud-controls { border-left: none; padding: 0; }
      .hud-footer {
        bottom: 0.75rem;
        padding: 0.5rem 1rem;
        font-size: 0.75rem;
      }
      .battle-hud {
        top: 8rem;
        padding: 0.5rem 1rem;
      }
      .trainer-drawer {
        width: calc(100vw - 2rem);
        right: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Loading State -->
  <div id="loader" class="loader-overlay">
    <div class="spinner"></div>
    <div style="font-size: 1.1rem; font-weight: 600; color: #fff;">Awakening Chakra Sensors...</div>
    <div style="font-size: 0.85rem; color: var(--muted); margin-top: 0.4rem;">Initializing Real-Time Hand Tracking & MediaPipe</div>
  </div>

  <!-- Master Canvas & Camera Video -->
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="vignette" class="vignette"></div>

  <!-- Dual Video FX Layers (Rasengan Left, Rasengan Right, Chidori) -->
  <video id="naruto-fx-left" class="fx" src="assets/naruto.mp4" muted autoplay loop playsinline></video>
  <video id="naruto-fx-right" class="fx" src="assets/naruto.mp4" muted autoplay loop playsinline></video>
  <video id="sasuke-fx" class="fx" src="assets/sasuke.mp4" muted autoplay loop playsinline></video>

  <!-- Interactive Hand Sign Overlay Button -->
  <button id="overlayBtn" class="video-overlay-btn" title="Click or Press SPACE to summon Shadow Clones">
    <img id="overlayImg" src="assets/state-1.png" data-state="1" alt="Clone Sign" />
  </button>

  <!-- Battle Scoreboard HUD (Shown in Battle Mode) -->
  <div id="battleHud" class="battle-hud">
    <div class="score-stat">
      <span class="score-label">Score</span>
      <span id="scoreVal" class="score-val highlight">0</span>
    </div>
    <div class="score-stat">
      <span class="score-label">Best</span>
      <span id="bestVal" class="score-val">0</span>
    </div>
    <div class="score-stat">
      <span class="score-label">Defeated</span>
      <span id="defeatedVal" class="score-val">0</span>
    </div>
  </div>

  <!-- Top Floating HUD -->
  <header class="hud-header">
    <div class="brand">
      <span class="brand-icon">🍥</span>
      <span>Naruto AR</span>
    </div>

    <!-- Mode Switcher -->
    <nav class="mode-tabs">
      <button class="tab-btn active" data-mode="combined" title="Rasengan, Chidori & Clones simultaneously">
        <span>🌀 All Jutsu</span>
      </button>
      <button class="tab-btn" data-mode="ninja" title="Dual Rasengan & Chidori Elemental Powers">
        <span>⚡ Ninja Powers</span>
      </button>
      <button class="tab-btn" data-mode="shadow" title="Shadow Clone Jutsu with Cross-Seal">
        <span>👥 Shadow Clone</span>
      </button>
      <button class="tab-btn" data-mode="battle" title="Defend against running rogue ninjas (+10 pts each!)">
        <span>⚔️ Ninja Battle</span>
      </button>
      <button class="tab-btn" data-mode="trainer" title="Train custom gestures">
        <span>🎯 Trainer</span>
      </button>
    </nav>

    <!-- Controls -->
    <div class="hud-controls">
      <!-- Jutsu Hand Loadout Preset -->
      <select id="jutsuPreset" class="jutsu-select" title="Choose which Jutsu to channel in hands">
        <option value="twin-rasengan">🌀 Twin Rasengan (Both Hands)</option>
        <option value="rasengan-chidori">⚡ Rasengan (L) + Chidori (R)</option>
        <option value="fire-style">🔥 Katon: Fireball Style</option>
      </select>

      <div id="sealBadge" class="conf-badge" title="Cross Seal Confidence">Seal: <span id="confText">0%</span></div>
      <button id="btnSkeleton" class="hud-btn active" title="Toggle Chakra Hand Mesh">
        <span>Chakra Mesh</span>
      </button>
      <button id="btnResetClones" class="hud-btn" title="Clear Clones / Reset (R)">
        <span>Reset (R)</span>
      </button>
    </div>
  </header>

  <!-- Bottom Dynamic Instruction Pill -->
  <footer class="hud-footer">
    <div id="guideContent" class="jutsu-guide">
      <!-- Injected dynamically -->
    </div>
  </footer>

  <!-- Slide-out Gesture Trainer Drawer -->
  <aside id="trainerDrawer" class="trainer-drawer">
    <div class="drawer-header">
      <div class="drawer-title">Jutsu Model Trainer</div>
      <button id="closeDrawer" class="drawer-close">&times;</button>
    </div>

    <div class="trainer-section">
      <div class="sec-label">1. Collect Training Data</div>
      <div class="btn-row">
        <button id="btnRecClone" class="action-btn">
          <span>● Clone Sign</span> <kbd class="guide-key">1</kbd>
        </button>
        <button id="btnRecOther" class="action-btn">
          <span>● Other Poses</span> <kbd class="guide-key">2</kbd>
        </button>
      </div>
      <div class="stats-card">
        <div>Clone Sign: <strong id="cntClone">0</strong></div>
        <div>Other Poses: <strong id="cntOther">0</strong></div>
      </div>
    </div>

    <div class="trainer-section">
      <div class="sec-label">2. Train & Test</div>
      <button id="btnTrainModel" class="action-btn primary">Train Neural Model</button>
      <p id="trainerStatus" class="trainer-status-text">Collect at least 20 samples of each pose, then train.</p>
    </div>

    <div class="trainer-section">
      <div class="sec-label">3. Data & Weights</div>
      <div class="btn-row">
        <button id="btnExportData" class="action-btn">Export Data</button>
        <button id="btnImportData" class="action-btn">Import Data</button>
        <button id="btnSaveModel" class="action-btn">Save Model</button>
        <button id="btnClearData" class="action-btn danger">Clear Samples</button>
      </div>
      <input type="file" id="importInput" accept=".json" style="display: none;">
    </div>
  </aside>

  <!-- Core Unified Application Script -->
  <script>
  (function() {
    'use strict';

    // ----------------------------------------------------
    // Sound FX Synthesizer (Native Web Audio API)
    // ----------------------------------------------------
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSound(type) {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'hit') {
          // Energetic electric explosion impact
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.28);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.29);
        } else if (type === 'seal') {
          // Chakra summon harmonic ring
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.35);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.36);
        }
      } catch (e) {}
    }

    class RunningNinjaEnemy {
      constructor() {
        this.dir = Math.random() < 0.5 ? 1 : -1;
        this.width = 65;
        this.height = 75;
        this.x = this.dir === 1 ? -70 : (window.innerWidth + 70);
        // Vary vertical running height
        this.y = window.innerHeight * (0.35 + Math.random() * 0.45);
        this.speed = (3.5 + Math.random() * 3.5) * this.dir;
        this.frame = Math.random() * 100;
        this.isDefeated = false;
        this.alpha = 1;
      }

      update() {
        this.x += this.speed;
        this.frame += 0.25;
        return (this.dir === 1 && this.x > window.innerWidth + 90) ||
               (this.dir === -1 && this.x < -90) ||
               (this.isDefeated && this.alpha <= 0);
      }

      draw(c) {
        c.save();
        c.translate(this.x, this.y);
        c.scale(this.dir, 1);
        c.globalAlpha = Math.max(0, this.alpha);

        const runCycle = Math.sin(this.frame);
        const legCycle = Math.cos(this.frame);

        // Stealth Ninja Suit Silhouette
        c.fillStyle = '#0f172a';
        c.strokeStyle = '#334155';
        c.lineWidth = 1.5;

        // Ninja Torso (Leaning forward in Naruto dash)
        c.beginPath();
        c.ellipse(0, -25, 12, 18, 0.4, 0, Math.PI * 2);
        c.fill();
        c.stroke();

        // Head with Ninja Mask
        c.beginPath();
        c.arc(10, -48, 10, 0, Math.PI * 2);
        c.fillStyle = '#1e293b';
        c.fill();

        // Red Glowing Sharingan / Rogue Visor Eye
        c.fillStyle = '#ef4444';
        c.shadowColor = '#ef4444';
        c.shadowBlur = 8;
        c.beginPath();
        c.ellipse(14, -48, 3.5, 2, 0, 0, Math.PI * 2);
        c.fill();
        c.shadowBlur = 0;

        // Trailing Headband Ribbons in Wind (Sine wave animation)
        c.strokeStyle = '#dc2626';
        c.lineWidth = 2.5;
        c.beginPath();
        c.moveTo(2, -48);
        const ribY1 = -48 + Math.sin(this.frame * 1.5) * 6;
        const ribY2 = -48 + Math.sin(this.frame * 1.5 + 1) * 8;
        c.quadraticCurveTo(-15, ribY1, -32, ribY2);
        c.stroke();

        // Classic Naruto Ninja Dash: Arms trailing back behind torso
        c.strokeStyle = '#0f172a';
        c.lineWidth = 4;
        c.beginPath();
        c.moveTo(0, -28);
        c.lineTo(-24, -20 + runCycle * 3);
        c.stroke();

        // Running Legs Scissoring Animation
        c.strokeStyle = '#020617';
        c.lineWidth = 4.5;
        // Front leg
        c.beginPath();
        c.moveTo(0, -10);
        c.lineTo(12 + runCycle * 14, 5 + Math.max(0, legCycle * 10));
        c.stroke();
        // Back leg
        c.beginPath();
        c.moveTo(0, -10);
        c.lineTo(-14 - runCycle * 14, 5 + Math.max(0, -legCycle * 10));
        c.stroke();

        c.restore();
      }
    }

    function spawnSparks(x, y, color = '#38bdf8') {

    function updateAndDrawBattle(c) {
      if (currentMode !== 'battle') return;

      const now = performance.now();
      // Spawn running ninjas at intervals
      if (now - lastEnemySpawnTime > 1400) {
        enemies.push(new RunningNinjaEnemy());
        lastEnemySpawnTime = now;
      }

      // Hitboxes for active ninja powers
      const activeHitboxes = [];
      if (pwrLeft > 0.15 && leftHandPos) {
        activeHitboxes.push({ x: leftHandPos.x, y: leftHandPos.y, radius: 85 });
      }
      if (pwrRight > 0.15 && rightHandPos) {
        activeHitboxes.push({ x: rightHandPos.x, y: rightHandPos.y, radius: 85 });
      }

      // Update & Draw Running Ninjas
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const isOffscreen = e.update();

        // Check collision against active ninja powers
        if (!e.isDefeated) {
          for (const hit of activeHitboxes) {
            const dist = Math.hypot(e.x - hit.x, (e.y - 25) - hit.y);
            if (dist < hit.radius + 35) {
              // ENEMY LIT UP / DEFEATED!
              e.isDefeated = true;
              e.alpha = 0;
              battleScore += 10;
              battleDefeated++;
              scoreVal.textContent = battleScore;
              defeatedVal.textContent = battleDefeated;

              if (battleScore > battleBest) {
                battleBest = battleScore;
                bestVal.textContent = battleBest;
                localStorage.setItem('naruto_ninja_best', battleBest.toString());
              }

              // Sound and particle celebration
              playSound('hit');
              spawnSparks(e.x, e.y - 25, (jutsuLoadout === 'fire-style') ? '#f97316' : '#38bdf8');
              spawnSmoke(e.x, e.y - 25, 0.7);
              spawnFloatingScore(e.x, e.y - 45, '+10');
              break;
            }
          }
        }

        if (isOffscreen) {
          enemies.splice(i, 1);
        } else {
          e.draw(c);
        }
      }

      // Update & Draw Sparks
      for (let i = sparkParticles.length - 1; i >= 0; i--) {
        const p = sparkParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.035;
        if (p.alpha <= 0) {
          sparkParticles.splice(i, 1);
          continue;
        }
        c.save();
        c.fillStyle = p.color;
        c.shadowColor = p.color;
        c.shadowBlur = 8;
        c.globalAlpha = p.alpha;
        c.beginPath();
        c.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }

      // Update & Draw Floating Scores
      for (let i = floatingScores.length - 1; i >= 0; i--) {
        const f = floatingScores[i];
        f.y += f.vy;
        f.alpha -= 0.025;
        if (f.alpha <= 0) {
          floatingScores.splice(i, 1);
          continue;
        }
        c.save();
        c.globalAlpha = f.alpha;
        c.font = '800 26px "Outfit", sans-serif';
        c.fillStyle = '#f59e0b';
        c.shadowColor = '#f59e0b';
        c.shadowBlur = 10;
        c.textAlign = 'center';
        c.fillText(f.text, f.x, f.y);
        c.restore();
      }
    }

    function drawSmokes() {
      const now = performance.now();
      for (let i = activeSmokes.length - 1; i >= 0; i--) {
        const s = activeSmokes[i];
        const elapsed = now - s.start;
        const frameDuration = SMOKE_DURATION / SMOKE_FRAME_COUNT;
        const frameIndex = Math.floor(elapsed / frameDuration);

        if (frameIndex >= s.frames.length) {
          activeSmokes.splice(i, 1);
          continue;
        }

        const img = s.frames[frameIndex];
        if (img && img.complete) {
          ctx.save();
          ctx.translate(s.x, s.y);
          ctx.scale(s.scale, s.scale);
          ctx.drawImage(img, -img.width / 2, -img.height / 2);
          ctx.restore();
        }
      }
    }

    // ----------------------------------------------------
    // Shadow Clone Detection: Geometric + Neural Hybrid
    // ----------------------------------------------------
    function normalizeHand(lm) {
      const w = lm[0];
      const mcp = lm[9];
      const scale = Math.hypot(mcp.x - w.x, mcp.y - w.y, (mcp.z || 0) - (w.z || 0)) || 1;
      const out = [];
      for (let i = 0; i < 21; i++) {
        out.push((lm[i].x - w.x) / scale);
        out.push((lm[i].y - w.y) / scale);
        out.push(((lm[i].z || 0) - (w.z || 0)) / scale);
      }
      return out;
    }

    function checkGeometricCrossSign(left, right) {
      if (!left || !right || left.length < 21 || right.length < 21) return 0;
      // Distance between wrists
      const wristDist = Math.hypot(left[0].x - right[0].x, left[0].y - right[0].y);
      // Distance between knuckles (index MCP)
      const knkDist = Math.hypot(left[5].x - right[5].x, left[5].y - right[5].y);

      // Hands close together in front of chest/body
      if (wristDist < 0.28 || knkDist < 0.22) {
        // Index fingers pointed upwards
        const leftUp = left[8].y < left[5].y;
        const rightUp = right[8].y < right[5].y;
        if (leftUp && rightUp) return 0.98;
        if (leftUp || rightUp) return 0.88;
        return 0.75;
      }
      return 0;
    }

    function evaluateShadowCloneSeal(right, left) {
      if (!right || !left) {
        confText.textContent = '0%';
        sealBadge.classList.remove('ready');
        crossSealHoldFrames = 0;
        return false;
      }

      // 1. Geometric cross-seal check
      const geomConf = checkGeometricCrossSign(left, right);

      // 2. Neural model prediction (test both permutations to prevent handedness swap bugs)
      let mlConf = 0;
      if (gestureModel) {
        try {
          const in1 = tf.tensor2d([[...normalizeHand(right), ...normalizeHand(left)]]);
          const in2 = tf.tensor2d([[...normalizeHand(left), ...normalizeHand(right)]]);
          const out1 = gestureModel.predict(in1);
          const out2 = gestureModel.predict(in2);
          const p1 = out1.dataSync()[0];
          const p2 = out2.dataSync()[0];
          mlConf = Math.max(p1, p2);
          in1.dispose();
          in2.dispose();
          out1.dispose();
          out2.dispose();
        } catch (e) {}
      }

      const totalConfidence = Math.max(geomConf, mlConf);
      confText.textContent = `${Math.round(totalConfidence * 100)}%`;

      if (totalConfidence >= 0.70) {
        sealBadge.classList.add('ready');
        crossSealHoldFrames++;
        // Hold pose for 2 frames to confirm
        if (crossSealHoldFrames >= 2) {
          return true;
        }
      } else {
        sealBadge.classList.remove('ready');
        crossSealHoldFrames = Math.max(0, crossSealHoldFrames - 1);
      }
      return false;
    }

    async function loadPretrainedModel() {
      try {
        gestureModel = await tf.loadLayersModel('gesture-model.json');
        console.log('Pre-trained gesture model loaded');
      } catch (e) {
        console.warn('Pretrained model not found, geometric seal detection active:', e);
      }

    // ----------------------------------------------------
    // Hand Openness & Dual-Hand Powers
    // ----------------------------------------------------
    function checkOpen(lm) {
      if (!lm || lm.length < 21) return false;
      let count = 0;
      const wrist = lm[0];
      const tips = [8, 12, 16, 20];
      const pips = [6, 10, 14, 18];
      for (let i = 0; i < tips.length; i++) {
        const tipDist = Math.hypot(lm[tips[i]].x - wrist.x, lm[tips[i]].y - wrist.y);
        const pipDist = Math.hypot(lm[pips[i]].x - wrist.x, lm[pips[i]].y - wrist.y);
        if (tipDist > pipDist) count++;
      }
      return count >= 3;
    }

    // Procedural Fireball Particles
    function spawnFireballParticles(x, y, radius) {
      for (let i = 0; i < 6; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * radius * 0.7;
        fireParticles.push({
          x: x + Math.cos(angle) * dist,
          y: y + Math.sin(angle) * dist,
          vx: (Math.random() - 0.5) * 3,
          vy: -2 - Math.random() * 4,
          radius: 12 + Math.random() * 16,
          color: Math.random() < 0.6 ? '#f97316' : (Math.random() < 0.5 ? '#ef4444' : '#fbbf24'),
          alpha: 0.85
        });
      }
    }

    function drawFireParticles(c) {
      for (let i = fireParticles.length - 1; i >= 0; i--) {
        const p = fireParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.radius *= 0.94;
        p.alpha -= 0.03;

        if (p.alpha <= 0 || p.radius < 1) {
          fireParticles.splice(i, 1);
          continue;
        }

        c.save();
        c.globalAlpha = p.alpha;
        c.fillStyle = p.color;
        c.shadowColor = p.color;
        c.shadowBlur = 15;
        c.beginPath();
        c.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    function updateDualNinjaPowers(leftHand, rightHand) {
      if (currentMode === 'shadow') {
        narutoFxLeft.style.display = 'none';
        narutoFxRight.style.display = 'none';
        sasukeFx.style.display = 'none';
        return;
      }

      // Check openness
      const openL = leftHand ? checkOpen(leftHand) : false;
      const openR = rightHand ? checkOpen(rightHand) : false;

      pwrLeft += openL ? 0.05 : -0.09;
      pwrLeft = Math.max(0, Math.min(1, pwrLeft));

      pwrRight += openR ? 0.05 : -0.09;
      pwrRight = Math.max(0, Math.min(1, pwrRight));

      // Play / restart video FX on trigger
      if (openL && !wasOpenLeft) {
        narutoFxLeft.currentTime = 0;
        narutoFxLeft.play().catch(() => {});
      }
      if (openR && !wasOpenRight) {
        if (jutsuLoadout === 'twin-rasengan') {
          narutoFxRight.currentTime = 0;
          narutoFxRight.play().catch(() => {});
        } else {
          sasukeFx.currentTime = 0;
          sasukeFx.play().catch(() => {});
        }
      }
      wasOpenLeft = openL;
      wasOpenRight = openR;

      // 1. LEFT HAND POWER
      if (pwrLeft > 0.01 && leftHand) {
        const wrist = leftHand[0];
        const knk = leftHand[9];
        const palmCenter = { x: (wrist.x + knk.x) / 2, y: (wrist.y + knk.y) / 2 };
        const handSpan = Math.hypot(leftHand[12].x - wrist.x, leftHand[12].y - wrist.y) * window.innerWidth;
        const screenX = (1 - palmCenter.x) * window.innerWidth;
        const screenY = palmCenter.y * window.innerHeight;
        leftHandPos = { x: screenX, y: screenY };

        if (jutsuLoadout === 'fire-style') {
          narutoFxLeft.style.display = 'none';
          spawnFireballParticles(screenX, screenY, Math.max(40, handSpan * 1.5));
        } else {
          // Rasengan on Left Hand
          narutoFxLeft.style.width = `${Math.max(300, Math.min(850, handSpan * 3.6))}px`;
          narutoFxLeft.style.left = `${screenX}px`;
          narutoFxLeft.style.top = `${screenY}px`;
          narutoFxLeft.style.display = 'block';
          narutoFxLeft.style.opacity = pwrLeft;
        }
      } else {
        leftHandPos = null;
        narutoFxLeft.style.display = 'none';
      }

      // 2. RIGHT HAND POWER
      if (pwrRight > 0.01 && rightHand) {
        const wrist = rightHand[0];
        const knk = rightHand[9];
        const palmCenter = { x: (wrist.x + knk.x) / 2, y: (wrist.y + knk.y) / 2 };
        const handSpan = Math.hypot(rightHand[12].x - wrist.x, rightHand[12].y - wrist.y) * window.innerWidth;
        const screenX = (1 - palmCenter.x) * window.innerWidth;
        const screenY = palmCenter.y * window.innerHeight;
        rightHandPos = { x: screenX, y: screenY };

        if (jutsuLoadout === 'twin-rasengan') {
          // Twin Rasengan on Right Hand as well!
          sasukeFx.style.display = 'none';
          narutoFxRight.style.width = `${Math.max(300, Math.min(850, handSpan * 3.6))}px`;
          narutoFxRight.style.left = `${screenX}px`;
          narutoFxRight.style.top = `${screenY}px`;
          narutoFxRight.style.display = 'block';
          narutoFxRight.style.opacity = pwrRight;
        } else if (jutsuLoadout === 'fire-style') {
          narutoFxRight.style.display = 'none';
          sasukeFx.style.display = 'none';
          spawnFireballParticles(screenX, screenY, Math.max(40, handSpan * 1.5));
        } else {

          sasukeFx.style.left = `${screenX}px`;
          sasukeFx.style.top = `${screenY}px`;
          sasukeFx.style.display = 'block';
          sasukeFx.style.opacity = pwrRight;
        }
      } else {
        rightHandPos = null;
        narutoFxRight.style.display = 'none';
        sasukeFx.style.display = 'none';
      }
    }

    // Glowing Chakra Hand Skeleton
    const FINGER_CHAINS = [
      [0, 1, 2, 3, 4],
      [0, 5, 6, 7, 8],
      [0, 9, 10, 11, 12],
      [0, 13, 14, 15, 16],
      [0, 17, 18, 19, 20],
      [0, 5, 9, 13, 17, 0] // Palm loop
    ];

    function drawChakraHand(lm, glowColor) {
      if (!showSkeleton || !lm) return;
      ctx.save();
      ctx.shadowBlur = 12;
      ctx.shadowColor = glowColor;
      ctx.strokeStyle = glowColor;
      ctx.lineWidth = 2.5;

      for (const chain of FINGER_CHAINS) {
        ctx.beginPath();
        chain.forEach((idx, i) => {
          const x = (1 - lm[idx].x) * canvas.width;
          const y = lm[idx].y * canvas.height;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
      }

      ctx.fillStyle = '#ffffff';
      lm.forEach((pt) => {
        ctx.beginPath();
        ctx.arc((1 - pt.x) * canvas.width, pt.y * canvas.height, 2.5, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    // ----------------------------------------------------
    // Mode Management & UI
    // ----------------------------------------------------
    const GUIDES = {
      combined: `
        <div class="guide-item"><span class="guide-key">Left Hand</span> <span class="guide-text">Open Palm → Rasengan</span></div>
        <div class="guide-item"><span class="guide-key">Right Hand</span> <span class="guide-text">Open Palm → Rasengan / Chidori</span></div>
        <div class="guide-item"><span class="guide-key">Both Hands</span> <span class="guide-text">Cross Seal → Shadow Clones</span></div>
      `,
      ninja: `
        <div class="guide-item"><span class="guide-key">Both Hands</span> <span class="guide-text">Rasengan channels on BOTH hands when opened</span></div>
        <div class="guide-item"><span class="guide-key">Loadout</span> <span class="guide-text">Use Jutsu dropdown for Twin Rasengan, Chidori, or Fire Style</span></div>
      `,
      shadow: `
        <div class="guide-item"><span class="guide-key">Cross Seal</span> <span class="guide-text">Cross index & middle fingers in front of chest</span></div>
        <div class="guide-item"><span class="guide-key">SPACE / Click</span> <span class="guide-text">Instant manual clone trigger</span></div>
      `,
      battle: `
        <div class="guide-item"><span class="guide-key">⚔️ Mission</span> <span class="guide-text" style="color: #fca5a5;">Defeat the running rogue ninjas with your active Jutsu!</span></div>
        <div class="guide-item"><span class="guide-key">+10 Pts</span> <span class="guide-text" style="color: #fbbf24;">Strike running ninjas with Rasengan/Chidori to lit them up</span></div>
      `,
      trainer: `
        <div class="guide-item"><span class="guide-key">1</span> <span class="guide-text">Record Clone Sign</span></div>
        <div class="guide-item"><span class="guide-key">2</span> <span class="guide-text">Record Other Poses</span></div>
        <div class="guide-item"><span class="guide-text" style="color: #34d399;">Train & test neural network live</span></div>
      `
    };

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });

      guideContent.innerHTML = GUIDES[mode] || '';

      // Mode-specific visuals
      vignette.classList.toggle('darkness-boost', mode === 'ninja' || mode === 'battle');
      overlayBtn.classList.toggle('visible', mode === 'combined' || mode === 'shadow');
      battleHud.classList.toggle('visible', mode === 'battle');

      if (mode === 'shadow') {
        narutoFxLeft.style.display = 'none';
        narutoFxRight.style.display = 'none';
        sasukeFx.style.display = 'none';
      }

      // Drawer
      trainerDrawer.classList.toggle('open', mode === 'trainer');
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });

    jutsuPreset.addEventListener('change', (e) => {
      jutsuLoadout = e.target.value;
    });

    btnSkeleton.addEventListener('click', () => {
      showSkeleton = !showSkeleton;
      btnSkeleton.classList.toggle('active', showSkeleton);
    });

    btnResetClones.addEventListener('click', resetClones);
    overlayBtn.addEventListener('click', triggerClones);

    closeDrawer.addEventListener('click', () => {
      trainerDrawer.classList.remove('open');
      if (currentMode === 'trainer') setMode('combined');
    });

    // ----------------------------------------------------
    // Gesture Trainer Module
    // ----------------------------------------------------
    let samples = { clone_sign: [], not_sign: [] };
    let recordingLabel = null;
    let recCountdownTimer = null;
    let recDurationTimer = null;
    const cntClone = document.getElementById('cntClone');
    const cntOther = document.getElementById('cntOther');
    const trainerStatus = document.getElementById('trainerStatus');

    function extractHandFeatures(right, left) {
      return [...normalizeHand(right), ...normalizeHand(left)];
    }

    function captureTrainerFrame(right, left) {
      if (!recordingLabel || !right || !left) return;
      samples[recordingLabel].push(extractHandFeatures(right, left));
      cntClone.textContent = samples.clone_sign.length;
      cntOther.textContent = samples.not_sign.length;
    }

    function startRecording(label) {
      clearInterval(recCountdownTimer);
      clearInterval(recDurationTimer);
      recordingLabel = null;

      let countdown = 3;
      trainerStatus.textContent = `Get ready for "${label === 'clone_sign' ? 'Clone Sign' : 'Other'}" in ${countdown}s...`;

      recCountdownTimer = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          trainerStatus.textContent = `Recording in ${countdown}s — strike your pose!`;
        } else {
          clearInterval(recCountdownTimer);
          recordingLabel = label;
          let remaining = 4;
          trainerStatus.textContent = `● RECORDING (${remaining}s) — hold still!`;

          recDurationTimer = setInterval(() => {
            remaining--;
            if (remaining > 0) {
              trainerStatus.textContent = `● RECORDING (${remaining}s) — hold still!`;
            } else {
              clearInterval(recDurationTimer);
              recordingLabel = null;
              trainerStatus.textContent = `Captured! Total: ${samples.clone_sign.length} Clone, ${samples.not_sign.length} Other.`;
            }
          }, 1000);
        }
      }, 1000);
    }

    document.getElementById('btnRecClone').addEventListener('click', () => startRecording('clone_sign'));
    document.getElementById('btnRecOther').addEventListener('click', () => startRecording('not_sign'));

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (e.key === '1') startRecording('clone_sign');
      if (e.key === '2') startRecording('not_sign');
      if (e.key.toLowerCase() === 'r') resetClones();
      if (e.key === ' ' || e.key.toLowerCase() === 'c') triggerClones();
    });

    document.getElementById('btnTrainModel').addEventListener('click', async () => {
      const nP = samples.clone_sign.length;
      const nN = samples.not_sign.length;
      if (nP < 5 || nN < 5) {
        trainerStatus.textContent = 'Need at least 5 samples in both classes before training.';
        return;
      }

      const xs = [], ys = [];
      samples.clone_sign.forEach(s => { xs.push(s); ys.push(1); });
      samples.not_sign.forEach(s => { xs.push(s); ys.push(0); });

      for (let i = xs.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [xs[i], xs[j]] = [xs[j], xs[i]];
        [ys[i], ys[j]] = [ys[j], ys[i]];
      }

      const xT = tf.tensor2d(xs);
      const yT = tf.tensor1d(ys);

      if (gestureModel) gestureModel.dispose();
      gestureModel = tf.sequential();
      gestureModel.add(tf.layers.dense({ inputShape: [126], units: 64, activation: 'relu' }));
      gestureModel.add(tf.layers.dropout({ rate: 0.25 }));
      gestureModel.add(tf.layers.dense({ units: 32, activation: 'relu' }));
      gestureModel.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));
      gestureModel.compile({ optimizer: 'adam', loss: 'binaryCrossentropy', metrics: ['accuracy'] });

      const btn = document.getElementById('btnTrainModel');
      btn.disabled = true;
      trainerStatus.textContent = 'Training neural network...';

      await gestureModel.fit(xT, yT, {
        epochs: 45,
        batchSize: 16,
        shuffle: true,
        callbacks: {
          onEpochEnd: (ep, logs) => {
            trainerStatus.textContent = `Epoch ${ep + 1}/45 — Accuracy: ${(logs.acc * 100).toFixed(1)}%`;
          }
        }
      });

      xT.dispose();
      yT.dispose();
      btn.disabled = false;
      trainerStatus.textContent = `Model trained successfully! Test the seal now in camera view.`;
    });

    document.getElementById('btnExportData').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(samples, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'naruto-gesture-data.json';
      a.click();
    });

    const importInput = document.getElementById('importInput');
    document.getElementById('btnImportData').addEventListener('click', () => importInput.click());
    importInput.addEventListener('change', (e) => {
      if (!e.target.files || !e.target.files[0]) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (data.clone_sign) samples.clone_sign.push(...data.clone_sign);
          if (data.not_sign) samples.not_sign.push(...data.not_sign);
          cntClone.textContent = samples.clone_sign.length;
          cntOther.textContent = samples.not_sign.length;
          trainerStatus.textContent = 'Dataset loaded successfully.';
        } catch (err) {
          trainerStatus.textContent = 'Error parsing JSON file.';
        }
      };
      reader.readAsText(e.target.files[0]);
    });

    document.getElementById('btnSaveModel').addEventListener('click', async () => {
      if (!gestureModel) {
        trainerStatus.textContent = 'Train or load a model first.';
        return;
      }
      await gestureModel.save('downloads://gesture-model');
      trainerStatus.textContent = 'Model exported as JSON + binary weights.';
    });

    document.getElementById('btnClearData').addEventListener('click', () => {
      samples = { clone_sign: [], not_sign: [] };
      cntClone.textContent = '0';
      cntOther.textContent = '0';
      trainerStatus.textContent = 'Sample data cleared.';
    });

    // ----------------------------------------------------
    // MediaPipe Holistic & Pipeline Integration
    // ----------------------------------------------------
    const selfie = new SelfieSegmentation({
      locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/${f}`,
    });
    selfie.setOptions({ modelSelection: 1 });
    selfie.onResults((r) => (mask = r.segmentationMask));

    const holistic = new Holistic({
      locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1675471629/${f}`,
    });
    holistic.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    holistic.onResults((res) => {
      loader.classList.add('hidden');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render mirrored camera video background
      ctx.save();
      ctx.scale(-1, 1);
      ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
      ctx.restore();

      // Shadow Clone Seal Inference (Both Geometric & ML)
      if (currentMode !== 'ninja') {
        const hasSeal = evaluateShadowCloneSeal(res.rightHandLandmarks, res.leftHandLandmarks);
        if (!clonesTriggered && hasSeal) {
          triggerClones();
        }
      }

      // Clones & Smoke Rendering
      if (clonesTriggered) {
        const now = performance.now();
        customClones.forEach((cl) => {
          if (!cl.smokeSpawned && now - cloneStartTime >= cl.delay) {
            cl.smokeSpawned = true;
            const centerX = cl.x + canvas.width / 2;
            const centerY = cl.y + canvas.height / 2 - 30;
            spawnSmoke(centerX - 15, centerY, cl.scale);
            spawnSmoke(centerX + 15, centerY, cl.scale);
          }
        });

        const person = grabPerson();
        drawClones(person);
        drawSmokes();
      }

      // Dual Hand Ninja Powers (Twin Rasengan, Chidori, Fireball)
      updateDualNinjaPowers(res.leftHandLandmarks || null, res.rightHandLandmarks || null);
      drawFireParticles(ctx);

      // Ninja Battle Mini-Game (Running Ninjas)
      updateAndDrawBattle(ctx);

      // Chakra Skeletons
      if (showSkeleton) {
        const glowColor = (currentMode === 'battle') ? '#f87171' : ((currentMode === 'ninja') ? '#00fbff' : '#a855f7');
        if (res.leftHandLandmarks) drawChakraHand(res.leftHandLandmarks, glowColor);
        if (res.rightHandLandmarks) drawChakraHand(res.rightHandLandmarks, glowColor);
      }

      // Capture trainer data if recording
      captureTrainerFrame(res.rightHandLandmarks, res.leftHandLandmarks);
    });

    // ----------------------------------------------------
    // Camera Start
    // ----------------------------------------------------
    const camera = new Camera(video, {
      width: 1280,
      height: 720,
      onFrame: async () => {
        await selfie.send({ image: video });
        await holistic.send({ image: video });
      },
    });

    camera.start().catch((err) => {
      console.error('Camera failed to start:', err);
      loader.innerHTML = `
        <div style="color: #ef4444; font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem;">Webcam Access Denied</div>
        <div style="color: var(--muted); font-size: 0.9rem; max-width: 420px; text-align: center;">Please allow camera permissions in your browser to release ninja jutsu!</div>
      `;
    });

    // Initialize
    loadPretrainedModel();
    setMode('combined');
  })();
  </script>
</body>
</html>
